aid: manticore-games
name: Manticore Games
description: 'Manticore Games is a San Mateo-based game developer and publisher, and
  the studio behind Core — a free, Unreal Engine-powered game-creation platform and
  metaverse where a global community of creators builds, publishes, and plays multiplayer
  games and experiences. Core exposes a rich Lua scripting API (namespaces, types,
  and events for Players, Weapons, Abilities, Storage, Leaderboards, Chat, UI, and
  World) that lets creators program game logic directly in the editor. Manticore is
  backed by SoftBank Vision Fund.'
