apis:
- name: Core Lua Scripting API
  description: 'The Core creator scripting API — a Lua-based developer surface for
    programming multiplayer game logic in the Core editor. Organized into namespaces
    (Chat, Storage, Leaderboards, Input, UI, VoiceChat, Game, World) and 100+ types
    (Player, Weapon, Ability, Vehicle, Inventory, DamageableObject). Not an HTTP/REST
    API — code runs inside the Core runtime.'
